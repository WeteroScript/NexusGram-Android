name: WaysGram source inspection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waysgram-inspect.yml'
      - 'nexusgram.part*'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original Android project
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          parts=(nexusgram.part*)
          if (( ${#parts[@]} != 9 )); then
            echo "::error::Expected 9 original source parts, found ${#parts[@]}"
            exit 1
          fi
          cat "${parts[@]}" > "$RUNNER_TEMP/original-source.zip"
          unzip -q "$RUNNER_TEMP/original-source.zip" -d "$RUNNER_TEMP/unpacked"
          test -d "$RUNNER_TEMP/unpacked/Telegram-master"
          rsync -a --exclude='.git/' "$RUNNER_TEMP/unpacked/Telegram-master/" "$GITHUB_WORKSPACE/"
          echo "ORIGINAL SOURCE RESTORED"

      - name: Locate original login, settings and app identity
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/waysgram-inspection"
          mkdir -p "$out/files" artifacts
          report="$out/inspection.txt"
          {
            echo "=== MANIFESTS ==="
            find . -path '*/build' -prune -o -name AndroidManifest.xml -print
            echo "=== LOGIN / AUTH CLASSES ==="
            find . -type f \( -iname '*login*' -o -iname '*phone*' -o -iname '*code*' \) \
              -not -path '*/build/*' | sort | sed -n '1,250p'
            echo "=== SETTINGS CLASSES ==="
            find . -type f \( -iname '*setting*' -o -iname '*preference*' \) \
              -not -path '*/build/*' | sort | sed -n '1,250p'
            echo "=== KEY CLASS DECLARATIONS ==="
            grep -RIl --include='*.java' -E 'class (SettingsActivity|LoginActivity|LaunchActivity|LoginOrView)' . \
              --exclude-dir=build | sort | sed -n '1,100p'
            echo "=== APP NAME RESOURCES ==="
            grep -RIn --include='strings.xml' -E 'app_name|AppName|Telegram' . \
              --exclude-dir=build | sed -n '1,180p'
            echo "=== MODULES ==="
            find . -maxdepth 3 -type f \( -name build.gradle -o -name build.gradle.kts -o -name settings.gradle \) | sort
          } > "$report"

          while IFS= read -r file; do
            case "$file" in
              *SettingsActivity.java|*LoginActivity.java|*LaunchActivity.java|*LoginOrView.java|*AndroidManifest.xml|*/values/strings.xml|*/values/strings*.xml)
                mkdir -p "$out/files/$(dirname "$file")"
                cp "$file" "$out/files/$file"
                ;;
            esac
          done < <(find . -type f \( -name '*SettingsActivity.java' -o -name '*LoginActivity.java' -o -name '*LaunchActivity.java' -o -name '*LoginOrView.java' -o -name AndroidManifest.xml -o -name 'strings.xml' \) -not -path '*/build/*')

          echo "=== SELECTED FILES ===" >> "$report"
          find "$out/files" -type f | sort >> "$report"
          cp "$report" artifacts/inspection.txt
          (cd "$out" && zip -qr "$GITHUB_WORKSPACE/artifacts/WaysGram-UI-Source-Snapshot.zip" files)
          cat "$report"

      - name: Upload UI inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaysGram-UI-Source-Inspection
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
