name: NexusGram Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'nexusgram.part*'
      - '.github/workflows/android.yml'
      - 'release/NexusGram-Standalone-Repository-Bundle-v3.tar.xz.b64.part*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_API: "21"
      BUILD_JOBS: "2"
      RUST_TOOLCHAIN: "1.96.1"

    steps:
      - name: Checkout NexusGram archive parts
        uses: actions/checkout@v4

      - name: Install host build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake git golang-go gperf \
            libclang-dev libtool-bin meson nasm ninja-build \
            perl pkg-config python3 rsync unzip yasm

      - name: Reassemble NexusGram source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          parts=(nexusgram.part*)

          if (( ${#parts[@]} != 9 )); then
            echo "::error::Expected 9 archive parts, found ${#parts[@]}"
            printf 'Found: %s\n' "${parts[@]}"
            exit 1
          fi

          cat "${parts[@]}" > nexusgram-source.zip
          unzip -q nexusgram-source.zip

          if [[ ! -d Telegram-master ]]; then
            echo "::error::Telegram-master directory was not found"
            find . -maxdepth 3 -type d | sort | head -120
            exit 1
          fi

          rsync -a --exclude='.git/' Telegram-master/ ./

          required_files=(
            settings.gradle
            gradlew
            TMessagesProj/jni/CMakeLists.txt
            TMessagesProj/jni/prebuild/build_all.sh
            TMessagesProj/jni/prebuild/common.sh
            TMessagesProj/jni/prebuild/build_boringssl.sh
            TMessagesProj/jni/prebuild/build_openh264.sh
            TMessagesProj/jni/prebuild/build_opus.sh
            TMessagesProj/jni/prebuild/build_libvpx.sh
            TMessagesProj/jni/prebuild/build_dav1d.sh
            TMessagesProj/jni/prebuild/build_ffmpeg.sh
            TMessagesProj/jni/prebuild/build_tlottie.sh
            TMessagesProj/jni/prebuild/build_wallet_engine.sh
            TMessagesProj/jni/prebuild/build_tdlib.sh
            TMessagesProj/jni/prebuild/build_wamr.sh
            TMessagesProj/jni/prebuild/build_prisma.sh
            TMessagesProj/jni/gram-wallet/Cargo.toml
            TMessagesProj/jni/prisma/CMakeLists.txt
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required source file is missing: $file"
              exit 1
            fi
            echo "[OK] $file"
          done

      - name: Integrate independent NexusGram client into the existing APK
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          parts=(release/NexusGram-Standalone-Repository-Bundle-v3.tar.xz.b64.part*)
          if (( ${#parts[@]} != 15 )); then
            echo "::error::Expected 15 standalone bundle segments, found ${#parts[@]}"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nexusgram-standalone"
          cat "${parts[@]}" | base64 --decode > "$RUNNER_TEMP/nexusgram-standalone.tar.xz"
          xz --test "$RUNNER_TEMP/nexusgram-standalone.tar.xz"
          tar -xJf "$RUNNER_TEMP/nexusgram-standalone.tar.xz" -C "$RUNNER_TEMP/nexusgram-standalone"

          source_root="$RUNNER_TEMP/nexusgram-standalone/android-standalone/app/src/main/java/app/nexusgram"
          test -s "$source_root/MainActivity.java"
          test -s "$source_root/network/NexusGramApiClient.java"
          target_root="TMessagesProj_App/src/main/java/app/nexusgram/standalone"
          mkdir -p "$target_root/network"

          python3 - "$source_root" "$target_root" <<'PY'
          from pathlib import Path
          import sys

          source_root = Path(sys.argv[1])
          target_root = Path(sys.argv[2])
          activity = (source_root / "MainActivity.java").read_text()
          api = (source_root / "network" / "NexusGramApiClient.java").read_text()

          activity = activity.replace(
              "package app.nexusgram;",
              "package app.nexusgram.standalone;",
              1,
          ).replace(
              "import app.nexusgram.network.NexusGramApiClient;",
              "import app.nexusgram.standalone.network.NexusGramApiClient;",
              1,
          )
          api = api.replace(
              "package app.nexusgram.network;",
              "package app.nexusgram.standalone.network;",
              1,
          )
          if "package app.nexusgram.standalone;" not in activity:
              raise SystemExit("Failed to relocate NexusGram Activity package")
          if "package app.nexusgram.standalone.network;" not in api:
              raise SystemExit("Failed to relocate NexusGram API client package")

          (target_root / "MainActivity.java").write_text(activity)
          (target_root / "network" / "NexusGramApiClient.java").write_text(api)
          print("Integrated standalone NexusGram Activity and REST client")
          PY

          manifest="TMessagesProj_App/src/main/AndroidManifest.xml"
          if [[ ! -f "$manifest" ]]; then
            echo "::error::Expected app manifest not found: $manifest"
            exit 1
          fi

          python3 - "$manifest" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          xml = path.read_text()
          activity_name = "app.nexusgram.standalone.MainActivity"
          if activity_name in xml:
              print("NexusGram standalone Activity is already registered")
              raise SystemExit(0)

          if not re.search(r'<application\b[^>]*>', xml, re.DOTALL):
              raise SystemExit("Could not locate application element in manifest")

          if "android.permission.INTERNET" not in xml:
              app_start = re.search(r'<application\b', xml)
              if not app_start:
                  raise SystemExit("Could not locate application element for INTERNET permission")
              permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
              xml = xml[:app_start.start()] + permission + xml[app_start.start():]

          app_match = re.search(r'<application\b[^>]*>', xml, re.DOTALL)
          app_tag = app_match.group(0)
          if "android:usesCleartextTraffic" not in app_tag:
              updated_tag = app_tag[:-1] + ' android:usesCleartextTraffic="true">'
          else:
              updated_tag = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  app_tag,
                  count=1,
              )
          xml = xml[:app_match.start()] + updated_tag + xml[app_match.end():]

          launcher = '''
              <activity
                  android:name="app.nexusgram.standalone.MainActivity"
                  android:label="NexusGram Independent"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity>
          '''
          if "</application>" not in xml:
              raise SystemExit("Could not locate application closing tag")
          xml = xml.replace("</application>", launcher + "\n</application>", 1)
          path.write_text(xml)
          print("Registered the second launcher entry: NexusGram Independent")
          PY

          test -s TMessagesProj_App/src/main/java/app/nexusgram/standalone/MainActivity.java
          test -s TMessagesProj_App/src/main/java/app/nexusgram/standalone/network/NexusGramApiClient.java
          grep -q 'app.nexusgram.standalone.MainActivity' "$manifest"
          python3 - "$manifest" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          print("Android manifest XML is valid")
          PY

      - name: Repair malformed Java string literals
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "TMessagesProj/src/main/java/org/telegram/ui/DeveloperPanelActivity.java"
          )

          if not path.is_file():
              raise SystemExit(f"Missing expected source file: {path}")

          source = path.read_text()

          pattern = re.compile(r'(\.append\(")(.*?)(?="\))', re.DOTALL)

          repaired, count = pattern.subn(
              lambda match: match.group(1) + match.group(2).replace(
                  "\n", r"\n"
              ),
              source,
          )

          if count == 0:
              raise SystemExit(
                  "No multiline append string literals matched. "
                  "Inspect DeveloperPanelActivity.java."
              )

          path.write_text(repaired)
          print(f"Repaired {count} multiline append string literal(s)")
          PY

          sed -n '270,310p' \
            TMessagesProj/src/main/java/org/telegram/ui/DeveloperPanelActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

          test -f "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Install Rust toolchain and Android targets
        shell: bash
        run: |
          set -Eeuo pipefail

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_TOOLCHAIN}"

          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          rustup target add --toolchain "${RUST_TOOLCHAIN}" \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

          rustc +"${RUST_TOOLCHAIN}" --version
          cargo +"${RUST_TOOLCHAIN}" --version
          rustup target list --toolchain "${RUST_TOOLCHAIN}" --installed

      - name: Fetch pinned Telegram submodule sources
        shell: bash
        run: |
          set -Eeuo pipefail

          clone_at() {
            local url="$1"
            local revision="$2"
            local destination="$3"

            echo "==> ${destination} @ ${revision}"
            rm -rf "$destination"
            mkdir -p "$(dirname "$destination")"
            git init --quiet "$destination"
            git -C "$destination" remote add origin "$url"
            git -C "$destination" fetch --quiet --no-tags --depth=1 origin "$revision"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
          }

          clone_at https://github.com/Arseny271/media.git \
            09b6c97c0d691c50cd4541e1573995d4066d6f5c \
            TMessagesProj_Modules/media

          clone_at https://github.com/dkaraush/jlatexmath-android.git \
            919e50b2f6f64b04b712cdb13d558ff9ecf9c8ed \
            TMessagesProj/lib/jlatexmath

          clone_at https://chromium.googlesource.com/libyuv/libyuv \
            28ce69c2744a6aafdb58564e7b884aec3f66be5f \
            TMessagesProj/jni/third_party/libyuv

          clone_at https://github.com/abseil/abseil-cpp.git \
            54fac219c4ef0bc379dfffb0b8098725d77ac81b \
            TMessagesProj/jni/third_party/absl

          clone_at https://github.com/TelegramMessenger/tgcalls.git \
            1398c1648f52666b3249111ec3c5b531946e41e4 \
            TMessagesProj/jni/tgcalls

          clone_at https://github.com/xiph/ogg.git \
            be05b13e98b048f0b5a0f5fa8ce514d56db5f822 \
            TMessagesProj/jni/third_party/xiph/ogg

          clone_at https://github.com/xiph/opus.git \
            22244de5a79bd1d6d623c32e72bf1954b56235be \
            TMessagesProj/jni/third_party/xiph/opus

          clone_at https://github.com/xiph/opusfile.git \
            a55c164e9891a9326188b7d4d216ec9a88373739 \
            TMessagesProj/jni/third_party/xiph/opusfile

          clone_at https://github.com/FFmpeg/FFmpeg.git \
            45f1910444f34b02621f9f0426ea1a538a613c41 \
            TMessagesProj/jni/third_party/ffmpeg

          clone_at https://github.com/webmproject/libvpx.git \
            1024874c5919305883187e2953de8fcb4c3d7fa6 \
            TMessagesProj/jni/third_party/libvpx

          clone_at https://github.com/videolan/dav1d.git \
            54706fc6bc0cdecab7e9593974a4039cc038fca7 \
            TMessagesProj/jni/third_party/dav1d

          clone_at https://github.com/google/boringssl.git \
            2b44a3701a4788e1ef866ddc7f143060a3d196c9 \
            TMessagesProj/jni/third_party/boringssl

          clone_at https://github.com/cisco/openh264.git \
            652bdb7719f30b52b08e506645a7322ff1b2cc6f \
            TMessagesProj/jni/third_party/openh264

          clone_at https://github.com/tdlib/td.git \
            022d60202e446ad1287b9fb68e687c8a0760788b \
            TMessagesProj/jni/td

          clone_at https://github.com/dkaraush/tlottie.git \
            31f1b542f88e7b4be9a01e749920d857535fc715 \
            TMessagesProj/jni/tlottie

          clone_at https://github.com/dkaraush/wallet-engine.git \
            5c65e47cb8d68727c20d89382d0bc51292486b9a \
            TMessagesProj/jni/wallet-engine

          clone_at https://github.com/wasm-micro-runtime/wasm-micro-runtime.git \
            25bd7eb63e828e4bd242cc9b38d260b4b31c6605 \
            TMessagesProj/jni/third_party/wamr

          clone_at https://github.com/boostorg/regex.git \
            4cbcd3078e6ae10d05124379623a1bf03fcb9350 \
            TMessagesProj/jni/third_party/boost-regex

          clone_at https://github.com/TelegramMessenger/libprisma.git \
            31a5d6fbbef8136e4a2b3adaf7b95e2ccaa7436d \
            TMessagesProj/jni/third_party/libprisma

          echo '=== Verify native source layout ==='

          test -f TMessagesProj/jni/third_party/ffmpeg/libavutil/timestamp.h
          test -f TMessagesProj/jni/third_party/libvpx/configure
          test -f TMessagesProj/jni/third_party/dav1d/meson.build
          test -f TMessagesProj/jni/third_party/boringssl/include/openssl/aes.h
          test -f TMessagesProj/jni/third_party/openh264/Makefile
          test -f TMessagesProj/jni/third_party/xiph/opus/opus_sources.mk
          test -f TMessagesProj/jni/third_party/xiph/opusfile/src/info.c
          test -f TMessagesProj/jni/td/CMakeLists.txt
          test -f TMessagesProj/jni/tlottie/Cargo.toml
          test -f TMessagesProj/jni/wallet-engine/Cargo.toml
          test -f TMessagesProj/jni/tgcalls/tgcalls/AudioDeviceHelper.cpp
          test -f TMessagesProj/jni/tgcalls/tgcalls/platform/android/AndroidInterface.cpp
          test -f TMessagesProj/jni/third_party/wamr/CMakeLists.txt
          test -f TMessagesProj/jni/third_party/libprisma/libprisma/SyntaxHighlighter.cpp
          test -f TMessagesProj/jni/third_party/boost-regex/include/boost/regex.hpp
          test -f TMessagesProj_Modules/media/core_settings.gradle
          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle

      - name: Build all Android native libraries
        working-directory: TMessagesProj/jni
        shell: bash
        run: |
          set -Eeuo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_HOME:?ANDROID_HOME was not set}"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          export NDK_VERSION="$ANDROID_NDK_VERSION"
          export API="$ANDROID_API"
          export ABIS='arm64-v8a armeabi-v7a x86_64 x86'
          export JOBS="$BUILD_JOBS"
          export TLOTTIE_RUST_TOOLCHAIN="$RUST_TOOLCHAIN"
          export CMAKE_BIN="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          export NINJA_BIN="$(command -v ninja)"
          export PATH="$ANDROID_SDK_ROOT/cmake/3.22.1/bin:$HOME/.cargo/bin:$PATH"

          test -x "$CMAKE_BIN"
          test -x "$NINJA_BIN"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

          chmod +x prebuild/*.sh
          bash prebuild/build_all.sh

          echo '=== Verify generated static libraries ==='

          libraries=(
            libcrypto.a libssl.a libopenh264.a libopus.a libvpx.a
            libdav1d.a libavcodec.a libavformat.a libavutil.a
            libswresample.a libswscale.a libtlottie.a
            libwallet_engine.a libtde2e.a libtdutils.a
            libiwasm.a libprisma.a
          )

          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            for library in "${libraries[@]}"; do
              file="prebuild/lib/${abi}/${library}"
              if [[ ! -s "$file" ]]; then
                echo "::error::Native library was not generated: $file"
                exit 1
              fi
            done
            echo "[OK] ${abi}: all static libraries exist"
          done

      - name: Configure Firebase for NexusGram
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 repository secret"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > TMessagesProj_App/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("TMessagesProj_App/google-services.json")
          data = json.loads(path.read_text())

          expected = "app.nexusgram"
          clients = data.get("client", [])

          packages = [
              client.get("client_info", {})
                    .get("android_client_info", {})
                    .get("package_name")
              for client in clients
          ]

          if expected not in packages:
              raise SystemExit(
                  f"Firebase package mismatch: expected {expected}, "
                  f"found {packages}"
              )

          print(f"Firebase configuration verified for {expected}")
          PY

      - name: Build NexusGram APK
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :TMessagesProj_App:assembleAfatRelease

      - name: Upload NexusGram APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusGram-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          retention-days: 14
