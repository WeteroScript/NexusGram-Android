name: NexusGram Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'nexusgram.part*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout upload parts
        uses: actions/checkout@v4

      - name: Reassemble source archive
        run: |
          set -e

          cat nexusgram.part* > nexusgram-source.zip
          unzip -q nexusgram-source.zip
          rsync -a --exclude='.git/' Telegram-master/ ./
          test -f settings.gradle

          mkdir -p TMessagesProj_Modules

          git clone --depth 1 https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          git -C TMessagesProj_Modules/media fetch --depth 1 origin 09b6c97c0d691c50cd4541e1573995d4066d6f5c
          git -C TMessagesProj_Modules/media checkout 09b6c97c0d691c50cd4541e1573995d4066d6f5c
          test -f TMessagesProj_Modules/media/core_settings.gradle

          mkdir -p TMessagesProj/lib

          git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          git -C TMessagesProj/lib/jlatexmath fetch --depth 1 origin 919e50b2f6f64b04b712cdb13d558ff9ecf9c8ed
          git -C TMessagesProj/lib/jlatexmath checkout 919e50b2f6f64b04b712cdb13d558ff9ecf9c8ed
          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle

          mkdir -p TMessagesProj/jni/third_party

          git clone --depth 1 https://chromium.googlesource.com/libyuv/libyuv TMessagesProj/jni/third_party/libyuv

          git clone --depth 1 --branch 20250127.1 https://github.com/abseil/abseil-cpp.git TMessagesProj/jni/third_party/absl

          git clone --depth 1 https://github.com/xiph/ogg.git TMessagesProj/jni/third_party/xiph/ogg
          git clone --depth 1 https://github.com/xiph/opus.git TMessagesProj/jni/third_party/xiph/opus
          git clone --depth 1 https://github.com/xiph/opusfile.git TMessagesProj/jni/third_party/xiph/opusfile

          git clone --depth 1 https://github.com/google/boringssl.git TMessagesProj/jni/third_party/boringssl

          git clone --depth 1 https://github.com/TelegramMessenger/tgcalls.git TMessagesProj/jni/tgcalls

          test -f TMessagesProj/jni/third_party/libyuv/CMakeLists.txt
          test -f TMessagesProj/jni/third_party/absl/CMakeLists.txt
          test -f TMessagesProj/jni/third_party/xiph/opusfile/src/info.c
          test -f TMessagesProj/jni/third_party/boringssl/include/openssl/aes.h
          test -f TMessagesProj/jni/third_party/boringssl/include/openssl/rand.h
          test -f TMessagesProj/jni/tgcalls/tgcalls/AudioDeviceHelper.cpp
          test -f TMessagesProj/jni/tgcalls/tgcalls/platform/android/AndroidInterface.cpp

          grep -Eq 'using[[:space:]]+Nonnull[[:space:]]*=' TMessagesProj/jni/third_party/absl/absl/base/nullability.h

          python3 - <<'PY'
          from pathlib import Path

          include = '#include "absl/base/nullability.h"'

          targets = [
              Path("TMessagesProj/jni/voip/webrtc/api/environment/environment.h"),
              Path("TMessagesProj/jni/voip/webrtc/api/task_queue/pending_task_safety_flag.h"),
              Path("TMessagesProj/jni/voip/webrtc/modules/audio_processing/include/audio_processing.h"),
          ]

          for path in targets:
              if not path.is_file():
                  raise SystemExit(f"Required WebRTC header missing: {path}")

              source = path.read_text(encoding="utf-8")

              if include not in source:
                  lines = source.splitlines()

                  guard_index = next(
                      (i for i, line in enumerate(lines) if line.startswith("#define ")),
                      None
                  )

                  if guard_index is None:
                      raise SystemExit(f"Header guard not found: {path}")

                  lines.insert(guard_index + 1, "")
                  lines.insert(guard_index + 2, include)

                  path.write_text(
                      "\n".join(lines) + "\n",
                      encoding="utf-8"
                  )

              if include not in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"Abseil nullability include missing: {path}")

              print(f"Verified: {path}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusGram-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          retention-days: 14
