name: NexusGram Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'nexusgram.part*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout upload parts
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            unzip \
            rsync \
            ninja-build \
            golang-go \
            yasm \
            nasm \
            python3 \
            build-essential \
            pkg-config

      - name: Reassemble source archive
        run: |
          set -e

          cat nexusgram.part* > nexusgram-source.zip
          unzip -q nexusgram-source.zip
          rsync -a --exclude='.git/' Telegram-master/ ./

          test -f settings.gradle
          test -f TMessagesProj/jni/build_ffmpeg_clang.sh
          test -f TMessagesProj/jni/build_libvpx_clang.sh
          test -f TMessagesProj/jni/patch_ffmpeg.sh
          test -f TMessagesProj/jni/patch_boringssl.sh
          test -f TMessagesProj/jni/build_boringssl.sh

          mkdir -p TMessagesProj_Modules

          git clone --depth 1 https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          git -C TMessagesProj_Modules/media fetch --depth 1 origin 09b6c97c0d691c50cd4541e1573995d4066d6f5c
          git -C TMessagesProj_Modules/media checkout 09b6c97c0d691c50cd4541e1573995d4066d6f5c

          test -f TMessagesProj_Modules/media/core_settings.gradle

          mkdir -p TMessagesProj/lib

          git clone --depth 1 https://github.com/dkaraush/jlatexmath-android.git TMessagesProj/lib/jlatexmath
          git -C TMessagesProj/lib/jlatexmath fetch --depth 1 origin 919e50b2f6f64b04b712cdb13d558ff9ecf9c8ed
          git -C TMessagesProj/lib/jlatexmath checkout 919e50b2f6f64b04b712cdb13d558ff9ecf9c8ed

          test -f TMessagesProj/lib/jlatexmath/jlatexmath/build.gradle

          mkdir -p TMessagesProj/jni/third_party

          git clone --depth 1 https://chromium.googlesource.com/libyuv/libyuv TMessagesProj/jni/third_party/libyuv

          git clone --depth 1 --branch 20250127.1 https://github.com/abseil/abseil-cpp.git TMessagesProj/jni/third_party/absl

          git clone --depth 1 https://github.com/xiph/ogg.git TMessagesProj/jni/third_party/xiph/ogg
          git clone --depth 1 https://github.com/xiph/opus.git TMessagesProj/jni/third_party/xiph/opus
          git clone --depth 1 https://github.com/xiph/opusfile.git TMessagesProj/jni/third_party/xiph/opusfile

          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git TMessagesProj/jni/third_party/ffmpeg
          git clone --depth 1 https://github.com/webmproject/libvpx.git TMessagesProj/jni/third_party/libvpx
          git clone --depth 1 https://github.com/videolan/dav1d.git TMessagesProj/jni/third_party/dav1d

          git clone --depth 1 https://github.com/google/boringssl.git TMessagesProj/jni/third_party/boringssl

          git clone --depth 1 https://github.com/TelegramMessenger/tgcalls.git TMessagesProj/jni/tgcalls

          test -f TMessagesProj/jni/third_party/ffmpeg/libavutil/timestamp.h
          test -f TMessagesProj/jni/third_party/libvpx/CMakeLists.txt
          test -f TMessagesProj/jni/third_party/dav1d/CMakeLists.txt
          test -f TMessagesProj/jni/third_party/absl/absl/base/nullability.h
          test -f TMessagesProj/jni/third_party/boringssl/include/openssl/aes.h
          test -f TMessagesProj/jni/third_party/xiph/opusfile/src/info.c

          test -f TMessagesProj/jni/tgcalls/tgcalls/AudioDeviceHelper.cpp
          test -f TMessagesProj/jni/tgcalls/tgcalls/platform/android/AndroidInterface.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build native dependencies
        working-directory: TMessagesProj/jni
        run: |
          set -e

          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export NINJA_PATH="$(command -v ninja)"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"

          test -d "$NDK"
          test -x "$NINJA_PATH"

          chmod +x \
            build_libvpx_clang.sh \
            build_ffmpeg_clang.sh \
            patch_ffmpeg.sh \
            patch_boringssl.sh \
            build_boringssl.sh

          ./build_libvpx_clang.sh
          ./build_ffmpeg_clang.sh
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh

      - name: Verify FFmpeg headers
        run: |
          set -e

          test -f TMessagesProj/jni/third_party/ffmpeg/libavutil/timestamp.h
          test -f TMessagesProj/jni/third_party/ffmpeg/libavformat/avformat.h
          test -f TMessagesProj/jni/third_party/ffmpeg/libavcodec/avcodec.h

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusGram-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          retention-days: 14
