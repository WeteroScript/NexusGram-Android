name: NexusGram Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'nexusgram.part*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout upload parts
        uses: actions/checkout@v4

      - name: Reassemble source archive
        run: |
          cat nexusgram.part* > nexusgram-source.zip
          unzip -q nexusgram-source.zip
          rsync -a --exclude='.git/' Telegram-master/ ./

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusGram-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          retention-days: 14
