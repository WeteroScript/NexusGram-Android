name: NexusGram Standalone Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'release/NexusGram-Standalone-Repository-Bundle-v3.tar.xz.b64.part*'
      - 'release/nexusgram-v4.patch.xz.b64'
      - '.github/workflows/nexusgram-standalone.yml'
  pull_request:
    paths:
      - 'release/NexusGram-Standalone-Repository-Bundle-v3.tar.xz.b64.part*'
      - 'release/nexusgram-v4.patch.xz.b64'
      - '.github/workflows/nexusgram-standalone.yml'

permissions:
  contents: read

concurrency:
  group: nexusgram-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test backend and build standalone APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore source bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          parts=(release/NexusGram-Standalone-Repository-Bundle-v3.tar.xz.b64.part*)
          if (( ${#parts[@]} != 15 )); then
            echo "::error::Expected 15 bundle segments, found ${#parts[@]}"
            printf '%s\n' "${parts[@]}"
            exit 1
          fi

          cat "${parts[@]}" | base64 --decode > "$RUNNER_TEMP/nexusgram-bundle.tar.xz"
          xz --test "$RUNNER_TEMP/nexusgram-bundle.tar.xz"
          mkdir -p "$GITHUB_WORKSPACE/.build/nexusgram"
          tar -xJf "$RUNNER_TEMP/nexusgram-bundle.tar.xz" -C "$GITHUB_WORKSPACE/.build/nexusgram"

          test -s .build/nexusgram/NexusGram-Termux-Backend/server.py
          test -s .build/nexusgram/NexusGram-Termux-Backend/tests/smoke_test.py
          test -s .build/nexusgram/android-standalone/app/src/main/AndroidManifest.xml

      - name: Apply NexusGram v4 source updates
        shell: bash
        run: |
          set -Eeuo pipefail
          base64 --decode release/nexusgram-v4.patch.xz.b64 > "$RUNNER_TEMP/nexusgram-v4.patch.xz"
          xz --test "$RUNNER_TEMP/nexusgram-v4.patch.xz"
          xz --decompress --stdout "$RUNNER_TEMP/nexusgram-v4.patch.xz" | patch --directory=.build/nexusgram --strip=1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run backend API smoke tests
        working-directory: .build/nexusgram/NexusGram-Termux-Backend
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile server.py tests/smoke_test.py
          python tests/smoke_test.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android source files
        shell: bash
        run: |
          set -Eeuo pipefail
          project='.build/nexusgram/android-standalone'
          required=(
            settings.gradle
            build.gradle
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/java/app/nexusgram/MainActivity.java
            app/src/main/java/app/nexusgram/network/NexusGramApiClient.java
          )
          for file in "${required[@]}"; do
            test -s "$project/$file"
            echo "[OK] $file"
          done

      - name: Build standalone APK
        working-directory: .build/nexusgram/android-standalone
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all --max-workers=2 clean assembleDebug

      - name: Verify APK package and contents
        shell: bash
        run: |
          set -Eeuo pipefail
          apk='.build/nexusgram/android-standalone/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          unzip -t "$apk"
          test "$(unzip -Z1 "$apk" | grep -E -c '^classes([0-9]+)?\.dex$')" -ge 1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/nexusgram-apk-badging.txt"
          grep -F "package: name='app.nexusgram'" "$RUNNER_TEMP/nexusgram-apk-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/nexusgram-apk-badging.txt"
          echo "APK verified: $apk"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: NexusGram-Standalone-APK
          path: .build/nexusgram/android-standalone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
